<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miraculous Hub — Просмотр серии</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #0f0d13;
      --card-bg: #1c1825;
      --card-hover: #262033;
      --red-main: #e61c40;
      --red-bright: #ff3355;
      --red-glow: rgba(230, 28, 64, 0.35);
      --text-white: #ffffff;
      --text-gray: #a099b0;
      --border: rgba(255, 255, 255, 0.1);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rubik', 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 85px;
    }

    header {
      background: rgba(28, 24, 37, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--red-main);
      padding: 0.8rem 1.2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-white);
    }

    .bug-avatar {
      width: 38px;
      height: 38px;
      background: var(--red-bright);
      border-radius: 50%;
      position: relative;
      border: 2px solid #fff;
      box-shadow: 0 0 10px var(--red-glow);
    }

    .bug-avatar::before, .bug-avatar::after {
      content: '';
      position: absolute;
      background: #000;
      border-radius: 50%;
    }

    .bug-avatar::before {
      width: 6px;
      height: 6px;
      top: 8px;
      left: 14px;
      box-shadow: -8px 10px 0 #000, 8px 10px 0 #000;
    }

    .bug-avatar::after {
      width: 6px;
      height: 6px;
      bottom: 7px;
      left: 14px;
    }

    .brand-name {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-white);
    }

    .brand-name span {
      color: var(--red-bright);
    }

    .tg-link {
      background: #229ed9;
      color: #fff;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    main {
      flex: 1;
      max-width: 750px;
      width: 100%;
      margin: 0 auto;
      padding: 1.2rem 1rem;
    }

    .player-wrapper {
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
      margin-bottom: 1.2rem;
      position: relative;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-wrapper video, 
    .player-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      object-fit: contain;
    }

    .no-video-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--text-gray);
      text-align: center;
      padding: 1rem;
    }

    .no-video-placeholder i {
      font-size: 2.5rem;
      color: var(--red-bright);
    }

    .video-details {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.2rem;
      margin-bottom: 1.5rem;
    }

    .video-tag {
      font-size: 0.8rem;
      color: var(--red-bright);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }

    .video-title {
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 0.6rem;
    }

    .video-meta-bar {
      display: flex;
      gap: 15px;
      font-size: 0.8rem;
      color: var(--text-gray);
    }

    .episodes-selector {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
    }

    .season-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 1rem;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .season-tabs::-webkit-scrollbar {
      display: none;
    }

    .season-tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-gray);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .season-tab-btn.active {
      background: var(--red-main);
      color: var(--text-white);
      border-color: var(--red-bright);
    }

    .selector-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .ep-item-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem;
      color: var(--text-white);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.2s ease;
    }

    .ep-item-btn:hover {
      background: var(--card-hover);
      border-color: var(--red-bright);
    }

    .ep-item-btn.active {
      background: var(--red-main);
      border-color: var(--red-bright);
      box-shadow: 0 0 10px var(--red-glow);
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #15121c;
      border-top: 1px solid var(--border);
      padding: 0.6rem 1rem;
      z-index: 1000;
    }

    .bar-nav {
      max-width: 450px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .bar-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.6rem;
      text-decoration: none;
      color: var(--text-white);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: 0.2s ease;
    }

    .bar-btn i {
      color: var(--red-bright);
      font-size: 1.1rem;
    }
  </style>
</head>

        { num: 21, title: "Кукловод 2", code: "321", date: "11 сентября 2019", videoUrl: "https://stream.unlockify.ink/backend/api/stream/AgAD7JgAAjxNMUk" },
        { num: 22, title: "Белый Кот", code: "322", date: "14 октября 2019", videoUrl: "https://stream.unlockify.ink/backend/api/stream/AgAD7ZgAAjxNMUk" },
        { num: 23, title: "Феликс", code: "323", date: "13 октября 2019", videoUrl: "https://stream.unlockify.ink/backend/api/stream/AgAD8JgAAjxNMUk" },
        { num: 24, title: "Леди Баг", code: "324", date: "15 октября 2019", videoUrl: "https://stream.unlockify.ink/backend/api/stream/AgAD8pgAAjxNMUk" },
        { num: 25, title: "Сердцеед (Битва за Талисманы - ч.1)", code: "325", date: "17 ноября 2019", videoUrl: "https://stream.unlockify.ink/backend/api/stream/AgAD85gAAjxNMUk" },
        { num: 26, title: "Королева Талисманов (Битва за Талисманы - ч.2)", code: "326", date: "23 ноября 2019", videoUrl: "https://stream.unlockify.ink/backend/api/stream/AgAD9JgAAjxNMUk" }
      ],
      specials: [
        { num: 1, title: "Санта с когтями (Худшее Рождество)", code: "226", date: "11 декабря 2016", videoUrl: "https://stream.unlockify.ink/backend/api/stream/AgADt5gAAjxNMUk" },
        { num: 2, title: "Нью-Йорк: Объединённые герои", code: "327", date: "25 сентября 2020", videoUrl: "https://stream.unlockify.ink/backend/api/stream/AgAD95gAAjxNMUk" }
      ]
    };

    let currentSeason = 1;
    const grid = document.getElementById('episodes-grid');
    const container = document.getElementById('player-container');

    function switchSeason(seasonKey) {
      currentSeason = seasonKey;
      
      document.querySelectorAll('.season-tab-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.getAttribute('data-season') === String(seasonKey));
      });
      
      const label = typeof seasonKey === 'number' ? `Серии ${seasonKey} сезона` : 'Спешлы';
      document.getElementById('season-title').textContent = label;
      
      renderButtons();
      loadEpisode(0);
    }

    function renderButtons() {
      grid.innerHTML = '';
      const list = seasonsData[currentSeason] || [];
      
      list.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.className = 'ep-item-btn';
        btn.textContent = `${item.num}. ${item.title}`;
        btn.onclick = () => loadEpisode(index);
        grid.appendChild(btn);
      });
    }

    function loadEpisode(index) {
      const list = seasonsData[currentSeason] || [];
      const item = list[index];
      if (!item) return;
      
      const seasonLabel = typeof currentSeason === 'number' ? `${currentSeason} Сезон` : 'Спешл';
      document.getElementById('ep-tag').textContent = `${seasonLabel} • Серия ${item.num}`;
      document.getElementById('ep-title').textContent = `«${item.title}»`;
      document.getElementById('ep-date').textContent = item.date;
      document.getElementById('ep-code').textContent = item.code;

      const buttons = grid.querySelectorAll('.ep-item-btn');
      buttons.forEach((b, i) => b.classList.toggle('active', i === index));

      if (item.videoUrl) {
        container.innerHTML = `
          <video controls autoplay playsinline controlsList="nodownload">
            <source src="${item.videoUrl}" type="video/mp4">
            Ваш браузер не поддерживает воспроизведение этого видео.
          </video>
        `;
      } else {
        container.innerHTML = `
          <div class="no-video-placeholder">
            <i class="fa-solid fa-film"></i>
            <p>Серия скоро появится...</p>
          </div>
        `;
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const seasonParamRaw = urlParams.get('s');
    const epParam = parseInt(urlParams.get('ep')) || 1;

    let initialSeason = 1;
    if (seasonParamRaw === 'specials') {
      initialSeason = 'specials';
    } else if (seasonParamRaw) {
      const parsedS = parseInt(seasonParamRaw);
      if (seasonsData[parsedS]) initialSeason = parsedS;
    }

    currentSeason = initialSeason;
    
    document.querySelectorAll('.season-tab-btn').forEach((btn) => {
      btn.classList.toggle('active', btn.getAttribute('data-season') === String(currentSeason));
    });
    
    const label = typeof currentSeason === 'number' ? `Серии ${currentSeason} сезона` : 'Спешлы';
    document.getElementById('season-title').textContent = label;

    renderButtons();

    const initialList = seasonsData[currentSeason] || [];
    const initialIndex = initialList.findIndex(item => item.num === epParam);

    loadEpisode(initialIndex !== -1 ? initialIndex : 0);
  </script>

</body>
