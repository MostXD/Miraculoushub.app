<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miraculous Hub — Сериал и Спешлы</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #0f0d13;
      --card-bg: #1c1825;
      --card-hover: #262033;
      --red-main: #e61c40;
      --red-bright: #ff3355;
      --red-glow: rgba(230, 28, 64, 0.35);
      --text-white: #ffffff;
      --text-gray: #a099b0;
      --border: rgba(255, 255, 255, 0.1);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rubik', 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 85px;
    }

    header {
      background: rgba(28, 24, 37, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--red-main);
      padding: 0.8rem 1.2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-white);
    }

    .bug-avatar {
      width: 38px;
      height: 38px;
      background: var(--red-bright);
      border-radius: 50%;
      position: relative;
      border: 2px solid #fff;
      box-shadow: 0 0 10px var(--red-glow);
    }

    .bug-avatar::before, .bug-avatar::after {
      content: '';
      position: absolute;
      background: #000;
      border-radius: 50%;
    }

    .bug-avatar::before {
      width: 6px;
      height: 6px;
      top: 8px;
      left: 14px;
      box-shadow: -8px 10px 0 #000, 8px 10px 0 #000;
    }

    .bug-avatar::after {
      width: 6px;
      height: 6px;
      bottom: 7px;
      left: 14px;
    }

    .brand-name {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-white);
    }

    .brand-name span {
      color: var(--red-bright);
    }

    .tg-link {
      background: #229ed9;
      color: #fff;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    main {
      flex: 1;
      max-width: 650px;
      width: 100%;
      margin: 0 auto;
      padding: 1.2rem 1rem;
    }

    .filter-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 0.8rem;
      margin-bottom: 1.2rem;
      scrollbar-width: none;
    }

    .filter-scroll::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-gray);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-chip.active {
      background: var(--red-bright);
      color: #fff;
      border-color: var(--red-bright);
      box-shadow: 0 0 10px var(--red-glow);
    }

    .episodes-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .episode-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.9rem 1.1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: var(--text-white);
      transition: all 0.2s ease;
    }

    .episode-card:hover {
      background: var(--card-hover);
      border-color: var(--red-bright);
      transform: translateX(4px);
    }

    .ep-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .ep-num {
      font-size: 0.75rem;
      color: var(--red-bright);
      font-weight: 700;
    }

    .ep-title {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .ep-date {
      font-size: 0.75rem;
      color: var(--text-gray);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .play-icon {
      width: 36px;
      height: 36px;
      background: rgba(230, 28, 64, 0.15);
      color: var(--red-bright);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .episode-card:hover .play-icon {
      background: var(--red-bright);
      color: #fff;
    }

    .empty-msg {
      text-align: center;
      color: var(--text-gray);
      padding: 2rem 0;
      font-size: 0.9rem;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #15121c;
      border-top: 1px solid var(--border);
      padding: 0.6rem 1rem;
      z-index: 1000;
    }

    .bar-nav {
      max-width: 450px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .bar-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.6rem;
      text-decoration: none;
      color: var(--text-white);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: 0.2s ease;
    }

    .bar-btn i {
      color: var(--red-bright);
      font-size: 1.1rem;
    }

    .bar-btn.active {
      background: var(--red-main);
      border-color: var(--red-main);
      box-shadow: 0 0 12px var(--red-glow);
    }

    .bar-btn.active i {
      color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand">
      <div class="bug-avatar"></div>
      <div class="brand-name">Miraculous <span>Hub</span></div>
    </a>
    <a href="https://t.me/videoformatmiracules" target="_blank" class="tg-link">

    <!-- Фильтры сезонов -->

    <!-- Контейнер со списком серий -->
    <div class="episodes-list" id="episodes-list"></div>
  </main>

      ]
    };

    let activeSeason = 1;

    function selectSeason(sKey) {
      activeSeason = sKey;

      const chips = document.querySelectorAll('.filter-chip');
      chips.forEach(chip => chip.classList.remove('active'));

      if (typeof sKey === 'number') {
        chips[sKey - 1].classList.add('active');
      } else if (sKey === 'specials') {
        chips[6].classList.add('active');
      }

      renderEpisodes();
    }

    function renderEpisodes() {
      const container = document.getElementById('episodes-list');
      container.innerHTML = '';

      const episodes = seasonsData[activeSeason];

      if (!episodes || episodes.length === 0) {
        container.innerHTML = `
          <div class="empty-msg">
            <i class="fa-solid fa-clock" style="font-size: 2rem; color: var(--red-bright); margin-bottom: 8px;"></i>
            <p>Серии этого раздела скоро появятся!</p>
          </div>
        `;
        return;
      }

      episodes.forEach(ep => {
        const card = document.createElement('a');
        card.className = 'episode-card';
        card.href = `player.html?s=${activeSeason}&ep=${ep.num}`;
        
        const seasonLabel = typeof activeSeason === 'number' ? `${activeSeason} Сезон` : 'Спешл';
        
        card.innerHTML = `
          <div class="ep-info">
            <span class="ep-num">${seasonLabel} • Серия ${ep.num} (Код: ${ep.code})</span>
            <div class="ep-title">«${ep.title}»</div>
            <div class="ep-date"><i class="fa-regular fa-calendar"></i> ${ep.date}</div>
          </div>
          <div class="play-icon"><i class="fa-solid fa-play"></i></div>
        `;
        container.appendChild(card);
      });
    }

    renderEpisodes();
  </script>
