    let activeSeason = 1;

    function selectSeason(sKey) {
      activeSeason = sKey;

      const chips = document.querySelectorAll('.filter-chip');
      chips.forEach(chip => {
        const chipSeason = chip.getAttribute('data-season');
        chip.classList.toggle('active', chipSeason === String(sKey));
      });

      renderEpisodes();
    }

    function renderEpisodes() {
      const container = document.getElementById('episodes-list');
      container.innerHTML = '';

      const episodes = seasonsData[activeSeason];

      if (!episodes || episodes.length === 0) {
        container.innerHTML = `
          <div class="empty-msg">
            <i class="fa-solid fa-clock" style="font-size: 2rem; color: var(--red-bright); margin-bottom: 8px;"></i>
            <p>Этот раздел скоро пополнится новыми релизами!</p>
          </div>
        `;
        return;
      }

      episodes.forEach(ep => {
        const card = document.createElement('a');
        card.className = 'episode-card';
        card.href = `player.html?s=${activeSeason}&ep=${ep.num}`;
        
        let seasonLabel = 'Спешл';
        if (typeof activeSeason === 'number') {
          seasonLabel = `${activeSeason} Сезон`;
        } else if (activeSeason === 'movies') {
          seasonLabel = 'Фильм';
        }
        
        card.innerHTML = `
          <div class="ep-info">
            <span class="ep-num">${seasonLabel} • №${ep.num} (Код: ${ep.code})</span>
            <div class="ep-title">«${ep.title}»</div>
            <div class="ep-date"><i class="fa-regular fa-calendar"></i> ${ep.date}</div>
          </div>
          <div class="play-icon"><i class="fa-solid fa-play"></i></div>
        `;
        container.appendChild(card);
      });
    }

    renderEpisodes();
  </script>
